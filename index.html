<!doctype html>
<html lang="es">
  <head>
    <script>
      (function() {
        try {
          var origFetch = typeof window !== 'undefined' ? window.fetch : null;
          var currentFetch = origFetch ? origFetch.bind(window) : null;
          function installSetter(target) {
            if (!target) return;
            try {
              Object.defineProperty(target, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(val) {
                  currentFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            } catch (_) {}
          }
          installSetter(window);
          if (typeof Window !== 'undefined' && Window.prototype) {
            installSetter(Window.prototype);
          }
        } catch (_) {}
      })();
    </script>
